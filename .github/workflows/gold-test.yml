name: Gold test (manual)

# Runs the Gold Rate Alert program on GitHub and shows the result as notices.
# Nothing is saved in the repository and no email is sent.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Kolkata
    steps:
      - name: Get the code
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_REF_NAME}"
          git checkout -q -B "${GITHUB_REF_NAME}" FETCH_HEAD

      - name: Run the program on a copy of the saved results
        run: |
          mkdir -p /tmp/gold-test/out
          cp -r gold-rate-alert/out/. /tmp/gold-test/out/ 2>/dev/null || true
          python3 gold-rate-alert/gold_rate.py --out /tmp/gold-test/out

      - name: Show the result
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          sys.path.insert(0, "cloud")
          import post_issue
          out = pathlib.Path("/tmp/gold-test/out")
          def notice(title, text):
              print(text)
              print("::notice title=%s::%s" % (title, text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")))
          try:
              report = json.loads((out / "last_run.json").read_text(encoding="utf-8"))
              markdown = (out / "latest.md").read_text(encoding="utf-8")
              history = json.loads((out / "history.json").read_text(encoding="utf-8"))
          except (OSError, ValueError) as exc:
              notice("Gold test failed", "No result to show: %s" % exc)
              sys.exit(1)
          notice("Gold test 1 sources", "\n".join("%s: %s %s" % (s["source"], "ok" if s["ok"] else "FAILED", s.get("error", ""))
                                                    for s in report["sources"]))
          notice("Gold test 2 alert", markdown)
          title, body = post_issue.build_issue(report, markdown, "owner")
          notice("Gold test 3 email", "title: %s\nfirst line: %s\nlast line: %s\nestimate: %s"
                 % (title, body.splitlines()[0], body.splitlines()[-1], json.dumps(report.get("estimate"))))
          notice("Gold test 4 saved", "official rates: %s\nworld price at these rates: %s" % (
              ", ".join("%s %s 916=%s 999=%s" % (day, part, values.get("916"), values.get("999"))
                        for day in sorted(history["fixes"]) for part, values in sorted(history["fixes"][day].items())),
              json.dumps(history["spot_at_fix"], sort_keys=True)))
          PY
