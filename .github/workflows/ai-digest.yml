name: AI Updates Digest

on:
  schedule:
    # 02:23 UTC is 07:53 AM in India (IST). GitHub often starts scheduled jobs late, and
    # most of all at round times such as :00 and :30. So this starts a little before 8:00.
    - cron: "23 2 * * *"
    # The backup start, one hour later, because GitHub sometimes does not start a scheduled
    # job at all. It does nothing when the first start has done the work (see "check").
    - cron: "23 3 * * *"
  workflow_dispatch:   # adds a "Run workflow" button, to run it by hand
    inputs:
      like_schedule:
        description: "Test only: act like a scheduled start"
        type: boolean
        default: false

permissions:
  contents: write   # to save the digest in this repository
  issues: write     # to open the issue that GitHub emails to you

# Two starts of this job never run at the same time: the second one waits for the first.
concurrency:
  group: ai-updates-digest
  cancel-in-progress: false

env:
  APP_DIR: ai-updates-digest

jobs:
  # A scheduled start does nothing when the last run finished less than 3 hours ago.
  # A start by hand always runs.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      go: ${{ steps.decide.outputs.go }}
    steps:
      - name: Get the code
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_REF_NAME}"
          git checkout -q -B "${GITHUB_REF_NAME}" FETCH_HEAD

      - name: Is there work to do
        id: decide
        env:
          LIKE_SCHEDULE: ${{ inputs.like_schedule }}
        run: python3 cloud/should_run.py

  digest:
    needs: check
    # Only a clear "no" from the check stops this job. If the check itself fails, it runs.
    if: ${{ !cancelled() && needs.check.outputs.go != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      TZ: Asia/Kolkata
      # "true": each digest is opened as an issue and GitHub emails it to you.
      # Set it to "false" to stop these issues.
      NOTIFY_BY_ISSUE: "true"
    steps:
      - name: Get the code
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_REF_NAME}"
          git checkout -q -B "${GITHUB_REF_NAME}" FETCH_HEAD

      - name: Collect the updates and build the digest
        run: python3 cloud/run_digest.py

      # The AI part: a small free model picks the items that matter most by meaning
      # and writes one short line about each of them (file ai_brief.py).
      # If anything here fails, the result is still saved and emailed as before.
      - name: Start the small AI model (no account, no key)
        continue-on-error: true
        timeout-minutes: 10
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: bash cloud/start_ai.sh

      - name: Let the AI model add its picks
        continue-on-error: true
        timeout-minutes: 10
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: python3 "${APP_DIR}/ai_brief.py"

      - name: Stop the AI model
        if: always()
        run: pkill -f "ollama" || true

      - name: Save the digest in this repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "${APP_DIR}/out"
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -q -m "AI Updates Digest $(date +%F)"
            # The other daily job can save at the same moment. Then its commit is taken in
            # first, and the save is tried again.
            for try in 1 2 3 4; do
              if git push -q origin "HEAD:${GITHUB_REF_NAME}"; then
                break
              fi
              if [ "${try}" = "4" ]; then
                echo "The digest could not be saved."
                exit 1
              fi
              sleep $((try * 5))
              git pull -q --rebase origin "${GITHUB_REF_NAME}"
            done
          fi

      - name: Email the digest to you through a GitHub issue
        if: env.NOTIFY_BY_ISSUE == 'true'
        run: python3 cloud/post_issue.py
